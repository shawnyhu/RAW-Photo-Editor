schema_version = "1.0.0"
id = "raw_photo_editor"
version = "1.1.1"
name = "RAW Photo Editor"
tagline = "Lightweight, open-source RAW development and film simulation"
maintainer = "ShawnHu"
type = "add-on"
tags = ["Compositing", "Import-Export", "User Interface"]
blender_version_min = "5.3.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["windows-x64", "macos-arm64"]
wheels = [
    "./wheels/rawpy-0.28.0+sh1-cp313-cp313-win_amd64.whl",
    "./wheels/rawpy-0.28.0-cp313-cp313-macosx_11_0_arm64.whl",
    "./wheels/pyexiv2-2.16.1-cp313-none-win_amd64.whl",
    "./wheels/pyexiv2-2.16.1-cp313-cp313-macosx_13_0_arm64.whl",
]

[permissions]
files = "Read photos and profiles, save presets, cache and export images"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".git/", ".DS_Store", "*.zip"]
