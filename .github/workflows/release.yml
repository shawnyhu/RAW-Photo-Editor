name: Verify published 1.0.2 beta on Apple Silicon
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec3f93fdc85d460e9325ae0b034db0f5198a15da
          persist-credentials: false
      - name: Install Blender and the published beta
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o blender.dmg https://download.blender.org/release/Blender5.3/blender-5.3.0-macos-arm64.dmg
          echo '2d802b54766741e612cead50b03ebbc8eb64dadc71eda932573d256b8a784720  blender.dmg' | shasum -a 256 -c -
          curl -fsSL --retry 3 -o raw_photo_editor-1.0.2-beta.1.zip https://github.com/shawnyhu/RAW-Photo-Editor/releases/download/v1.0.2-beta.1/raw_photo_editor-1.0.2-beta.1.zip
          echo 'eaf6bfe14ab79a5edf0e255102396c9ebb6e9106fa33e315704acdeefc97c3bc  raw_photo_editor-1.0.2-beta.1.zip' | shasum -a 256 -c -
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/blender-dmg" blender.dmg
          BLENDER="$RUNNER_TEMP/blender-dmg/Blender.app/Contents/MacOS/Blender"
          export BLENDER_USER_RESOURCES="$RUNNER_TEMP/clean-profile"
          mkdir -p "$BLENDER_USER_RESOURCES"
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
          echo "BLENDER_USER_RESOURCES=$BLENDER_USER_RESOURCES" >> "$GITHUB_ENV"
          "$BLENDER" -b --factory-startup --offline-mode --command extension install-file --repo user_default --enable "$RUNNER_TEMP/raw_photo_editor-1.0.2-beta.1.zip"
      - name: Run installed import, batch export and crop tests
        run: |
          "$BLENDER" -b --offline-mode --python-exit-code 1 -P tests/native_install_smoke.py
          "$BLENDER" -b --offline-mode --python-exit-code 1 -P tests/import_batch_paths.py
          "$BLENDER" -b --offline-mode --python-exit-code 1 -P tests/batch_export_format.py -- --installed
          "$BLENDER" -b --offline-mode --python-exit-code 1 -P tests/crop_perspective.py
      - name: Check active photo priority and cross-photo export bindings
        run: |
          "$BLENDER" -b --factory-startup --offline-mode --python-exit-code 1 -P tests/preview_scheduling.py
          "$BLENDER" -b --factory-startup --offline-mode --python-exit-code 1 -P tests/native_source_binding.py