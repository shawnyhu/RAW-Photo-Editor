name: Publish verified Spektrafilm preset beta
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: '45947138524'
      RELEASE_SHA: 7f3555e3ebd63dfb1aacb1acd267daad5018fc2d
      VERSION: 1.0.2-beta.4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the source and validation result
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" |
            jq -e --arg sha "$RELEASE_SHA" '.head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/release.yml"'
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ env.VERIFIED_RUN }}
          github-token: ${{ github.token }}
          name: raw_photo_editor-${{ env.VERSION }}.zip
          skip-decompress: true
          path: dist-release
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ env.VERIFIED_RUN }}
          github-token: ${{ github.token }}
          name: raw_photo_editor-source-${{ env.VERSION }}.zip
          skip-decompress: true
          path: dist-release
      - name: Compare both CI digests and publish the tested installer
        working-directory: dist-release
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/artifacts" > "$RUNNER_TEMP/assets.json"
          installer="raw_photo_editor-$VERSION.zip"
          source="raw_photo_editor-source-$VERSION.zip"
          for name in "$installer" "$source"; do
            expected=$(jq -er --arg name "$name" '.artifacts[] | select(.name==$name and (.expired|not)) | .digest' "$RUNNER_TEMP/assets.json")
            digest=$(sha256sum "$name" | cut -d' ' -f1)
            test "sha256:$digest" = "$expected"
            printf '%s  %s\n' "$digest" "$name" > "$name.sha256"
            unzip -tq "$name"
          done
          gh release create "v$VERSION" "$installer" "$installer.sha256" "$source" "$source.sha256" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --prerelease --latest=false --title "RAW Photo Editor $VERSION" --notes-file ../beta-notes.md
