name: Publish tested Crop beta
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: '45735328785'
      RELEASE_SHA: 88bd66bea6359bfeac936df6ea4319598fbc787b
      TAG: v1.0.2-beta.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the successful validation run
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" > "$RUNNER_TEMP/run.json"
          jq -e --arg sha "$RELEASE_SHA" '.head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/release.yml"' "$RUNNER_TEMP/run.json"
      - uses: actions/download-artifact@v8
        with:
          run-id: '45735328785'
          github-token: ${{ github.token }}
          name: raw_photo_editor-1.0.2-beta.2.zip
          skip-decompress: true
          path: dist-release
      - uses: actions/download-artifact@v8
        with:
          run-id: '45735328785'
          github-token: ${{ github.token }}
          name: raw_photo_editor-source-1.0.2-beta.2.zip
          skip-decompress: true
          path: dist-release
      - name: Verify both digests and publish the prerelease
        working-directory: dist-release
        run: |
          set -euo pipefail
          installer=raw_photo_editor-1.0.2-beta.2.zip
          source=raw_photo_editor-source-1.0.2-beta.2.zip
          printf '%s  %s\n' d18041c09f76c5ec05e569e454bddf947be64d365981d96b4016c8f6056cda70 "$installer" > "$installer.sha256"
          printf '%s  %s\n' 5abb527bb5bc4c262440e14af31a6c0e0cbfdcad53b65394f5f2562207367699 "$source" > "$source.sha256"
          sha256sum -c "$installer.sha256"
          sha256sum -c "$source.sha256"
          unzip -tq "$installer"
          unzip -tq "$source"
          gh release create "$TAG" "$installer" "$installer.sha256" "$source" "$source.sha256" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --prerelease --latest=false --title 'RAW Photo Editor 1.0.2-beta.2' --notes-file ../beta-notes.md
