name: Build additional Lite stock tables for Apple Silicon
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile the offline Metal stock catalogue
        working-directory: blender_raw/vendor/spektrafilm
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          python -m pip install numpy==2.5.5 scipy==1.18.1 colour-science==0.4.7
          python build_macos.py
          lipo libphoto_film.dylib -verify_arch arm64
          codesign --verify --strict libphoto_film.dylib
          git diff --exit-code HEAD -- SpektraFilm.metal SpektraHanatos2025Spectra.f32 SpektraOutputGamutCompression.f32
          python - <<'PY'
          import ctypes, json, tarfile
          with tarfile.open('additional-stock-data.tar.gz') as archive:
              data = json.load(archive.extractfile('Resources/data/stock_catalog.json'))
          lib = ctypes.CDLL('./libphoto_film.dylib')
          for group, count, size, name, legacy in (
              ('films', lib.SpektraAppFilmCount, len(data['films']), lib.SpektraAppFilmName, 20),
              ('papers', lib.SpektraAppPaperCount, len(data['papers']), lib.SpektraAppPaperName, 8),
          ):
              name.argtypes, name.restype = [ctypes.c_int], ctypes.c_char_p
              assert count() == size + legacy
              assert [name(i).decode() for i in range(legacy, count())] == data[group]
              print(group, count())
          assert lib.photo_film_stock_calibration
          PY
          tar -czf "$RUNNER_TEMP/lite-stock-metal.tar.gz" libphoto_film.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: lite-stock-metal
          path: ${{ runner.temp }}/lite-stock-metal.tar.gz
          if-no-files-found: error
